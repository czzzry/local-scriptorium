name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - run: scriptorium ingest
      - run: scriptorium evaluate --split test --deterministic
      - run: scriptorium report
      - run: python scripts/privacy_check.py


[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-scriptorium"
version = "0.3.0"
description = "A deterministic, local-first RAG evaluation harness"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Local Scriptorium contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]
vector = ["numpy>=2"]

[project.scripts]
scriptorium = "local_scriptorium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
